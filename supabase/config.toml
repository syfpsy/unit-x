# Supabase project config — managed by `supabase config push`.
# Keep this file in git (no secrets here). Provider secrets live in the
# Supabase dashboard / Vercel env and never touch the repo.

project_id = "opflfqtuqcjpmjyyqfrz"

[auth]
# Where Supabase lands a user when redirect_to is missing or not on the
# allowlist below. Production URL — local dev overrides via Vercel env.
site_url = "https://unit-x-eta.vercel.app"

# Every URL the client may request a redirect to. Magic link + OAuth
# both validate against this list; anything outside falls back to
# `site_url` with an ?error= query param (which is what bit us in
# earlier testing).
additional_redirect_urls = [
  "http://localhost:3000/auth/confirm",
  "http://localhost:3000/auth/callback",
  "https://unit-x-eta.vercel.app/auth/confirm",
  "https://unit-x-eta.vercel.app/auth/callback",
]

# Tight session lifetime — long-lived sessions are a liability.
jwt_expiry = 3600           # 1 hour access token

[auth.email]
# Magic-link only. No passwords anywhere in the product.
enable_signup = true
enable_confirmations = true
# Match current server values to avoid incidental drift. Tune later
# if deliberate.
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

# Google OAuth. Client ID is public (the consent screen shows it in the
# URL), so it can live in git. The secret is pulled from the local env
# (see .env.local / Vercel) at `supabase config push` time — never hits
# the repo. Rotate via RUNBOOK.md → "Rotate the Google OAuth client secret".
[auth.external.google]
enabled = true
client_id = "656798741201-kmhts0j5ktq1d7s3b8kbol8qq9nrov5v.apps.googleusercontent.com"
secret = "env(GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false
